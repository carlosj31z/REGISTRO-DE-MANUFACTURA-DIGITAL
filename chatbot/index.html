<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente de configuraciones RMD</title>
<style>
  :root {
    --fondo: #0f172a; --panel: #111c33; --borde: #24324f; --texto: #e2e8f0; --tenue: #94a3b8;
    --mio: #14532d; --suyo: #1e293b; --acento: #22c55e; --alerta: #f59e0b; --error: #ef4444;
  }
  html[data-theme="light"] {
    --fondo: #eef2f6; --panel: #ffffff; --borde: #d5dde8; --texto: #0f172a; --tenue: #5b6b80;
    --mio: #d9fdd3; --suyo: #ffffff; --acento: #15803d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto); }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--borde); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  header small { color: var(--tenue); font-weight: 400; display: block; font-size: 12px; }
  nav button, .btn { background: transparent; color: var(--texto); border: 1px solid var(--borde); border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  nav button.activo { border-color: var(--acento); color: var(--acento); }
  .btn.primario { background: var(--acento); border-color: var(--acento); color: #fff; }
  main { max-width: 860px; margin: 0 auto; padding: 0 16px; }
  #vistaChat { display: flex; flex-direction: column; height: calc(100vh - 57px); }
  #mensajes { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 82%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; border: 1px solid var(--borde); }
  .msg.yo { align-self: flex-end; background: var(--mio); }
  .msg.bot { align-self: flex-start; background: var(--suyo); }
  .msg.sis { align-self: center; background: transparent; border-style: dashed; color: var(--tenue); font-size: 13px; }
  .msg .sol { margin-top: 6px; font-size: 12px; color: var(--tenue); }
  form#escribir { display: flex; gap: 8px; padding: 10px 0 16px; }
  form#escribir textarea { flex: 1; resize: none; min-height: 44px; max-height: 140px; padding: 10px; border-radius: 8px; border: 1px solid var(--borde); background: var(--panel); color: var(--texto); font: inherit; }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  .fila input, .fila select { padding: 7px 9px; border-radius: 6px; border: 1px solid var(--borde); background: var(--panel); color: var(--texto); font: inherit; font-size: 14px; }
  .tarjeta { background: var(--panel); border: 1px solid var(--borde); border-radius: 8px; padding: 12px; margin: 10px 0; }
  .tarjeta h3 { margin: 0 0 4px; font-size: 15px; }
  .tarjeta pre { white-space: pre-wrap; font: 13px/1.4 ui-monospace, Consolas, monospace; color: var(--tenue); margin: 6px 0; max-height: 220px; overflow: auto; }
  .estado { font-size: 12px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--borde); margin-left: 6px; }
  .estado.nueva, .estado.revisar { border-color: var(--alerta); color: var(--alerta); }
  .estado.lista, .estado.ejecutando { border-color: #38bdf8; color: #38bdf8; }
  .estado.ejecutada, .estado.resuelta { border-color: var(--acento); color: var(--acento); }
  .estado.rechazada { border-color: var(--error); color: var(--error); }
  .tenue { color: var(--tenue); font-size: 13px; }
  .oculto { display: none !important; }
  @media (max-width: 600px) { .msg { max-width: 92%; } header h1 small { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Asistente de configuraciones RMD <small>Documentación Técnica · prueba sin WhatsApp</small></h1>
  <nav>
    <button id="tabChat" class="activo">Chat</button>
    <button id="tabBandeja">Bandeja del analista</button>
    <button id="tema" title="Tema claro u oscuro">Tema</button>
  </nav>
</header>
<main>
  <section id="vistaChat">
    <div class="fila" id="datos">
      <input id="nombre" placeholder="Tu nombre" maxlength="60">
      <select id="area"><option>Producción</option><option>Calidad en Operaciones</option><option>Documentación Técnica</option></select>
      <input id="clave" type="password" placeholder="Clave de acceso (si te la dieron)" class="oculto">
      <button class="btn" id="reiniciar" type="button">Empezar de nuevo</button>
      <button class="btn" id="verMias" type="button">Mis solicitudes</button>
    </div>
    <div id="mensajes" aria-live="polite"></div>
    <form id="escribir">
      <textarea id="texto" placeholder="Escribe como en WhatsApp, p. ej.: necesito que habiliten el paso de tamizado en el RMD 2202609013" rows="1"></textarea>
      <button class="btn primario" type="submit">Enviar</button>
    </form>
  </section>

  <section id="vistaBandeja" class="oculto">
    <div class="fila">
      <input id="claveAnalista" type="password" placeholder="Clave de analista">
      <input id="nombreAnalista" placeholder="Tu usuario (queda como aprobador)">
      <select id="filtro"><option value="">Todas</option><option value="nueva,revisar">Por atender</option><option value="lista,ejecutando">En ejecución</option><option value="ejecutada,resuelta,rechazada">Cerradas</option></select>
      <button class="btn primario" id="cargar">Cargar</button>
      <span class="tenue" id="modoBandeja"></span>
    </div>
    <div id="listaBandeja"></div>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const leer = (k, d = '') => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

  // Tema
  const aplicarTema = (t) => document.documentElement.setAttribute('data-theme', t);
  aplicarTema(leer('chatbotTema', 'dark'));
  $('tema').onclick = () => { const t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'; aplicarTema(t); guardar('chatbotTema', t); };

  // Pestañas
  $('tabChat').onclick = () => { $('vistaChat').classList.remove('oculto'); $('vistaBandeja').classList.add('oculto'); $('tabChat').classList.add('activo'); $('tabBandeja').classList.remove('activo'); };
  $('tabBandeja').onclick = () => { $('vistaBandeja').classList.remove('oculto'); $('vistaChat').classList.add('oculto'); $('tabBandeja').classList.add('activo'); $('tabChat').classList.remove('activo'); };

  // Identidad del navegador (equivale al número de WhatsApp en la prueba)
  let contacto = leer('chatbotContacto');
  if (!/^web:[\w-]{8,64}$/.test(contacto)) { contacto = 'web:' + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)); guardar('chatbotContacto', contacto); }
  $('nombre').value = leer('chatbotNombre'); $('area').value = leer('chatbotArea', 'Producción');
  $('nombre').onchange = () => guardar('chatbotNombre', $('nombre').value.trim());
  $('area').onchange = () => guardar('chatbotArea', $('area').value);
  $('clave').value = leer('chatbotClave'); $('clave').onchange = () => guardar('chatbotClave', $('clave').value);
  $('claveAnalista').value = leer('chatbotClaveAnalista'); $('claveAnalista').onchange = () => guardar('chatbotClaveAnalista', $('claveAnalista').value);
  $('nombreAnalista').value = leer('chatbotNombreAnalista'); $('nombreAnalista').onchange = () => guardar('chatbotNombreAnalista', $('nombreAnalista').value.trim());

  async function api(cuerpo, analista = false) {
    const h = { 'Content-Type': 'application/json' };
    if ($('clave').value) h['x-clave'] = $('clave').value;
    if (analista) h['x-clave-analista'] = $('claveAnalista').value;
    const r = await fetch('/api/chatbot', { method: 'POST', headers: h, body: JSON.stringify(cuerpo) });
    const d = await r.json().catch(() => ({ error: 'Respuesta no válida del servidor (' + r.status + ').' }));
    if (!r.ok) throw new Error(d.error || ('Error ' + r.status));
    return d;
  }

  const ETIQUETA = { nueva: 'para el analista', lista: 'se aplicará en SAP', ejecutando: 'aplicándose', ejecutada: 'aplicada', revisar: 'la revisa el analista', rechazada: 'rechazada', resuelta: 'resuelta' };

  function burbuja(texto, quien, extra) {
    const d = document.createElement('div');
    d.className = 'msg ' + quien; d.textContent = texto;
    if (extra) { const s = document.createElement('div'); s.className = 'sol'; s.textContent = extra; d.appendChild(s); }
    $('mensajes').appendChild(d); $('mensajes').scrollTop = $('mensajes').scrollHeight;
    return d;
  }

  // Historial visible solo en este navegador (el servidor guarda la conversación real)
  let visibles = [];
  try { visibles = JSON.parse(leer('chatbotVisibles', '[]')); } catch {}
  const recordar = () => guardar('chatbotVisibles', JSON.stringify(visibles.slice(-60)));
  if (!visibles.length) visibles.push({ q: 'bot', t: 'Hola. Soy el asistente de configuraciones de RMD de Documentación Técnica. Cuéntame qué necesitas: una duda de configuración o un cambio (por ejemplo, habilitar un paso o cambiar decimales). Ten a mano el código del RMD.' });
  visibles.forEach((m) => burbuja(m.t, m.q, m.x));

  api({ accion: 'estado' }).then((e) => {
    if (e.requiereClave) $('clave').classList.remove('oculto');
    if (!e.listo) burbuja('El asistente aún no tiene configurada la clave de la API de Claude en Vercel (ANTHROPIC_API_KEY).', 'sis');
  }).catch(() => burbuja('No se pudo contactar al asistente. ¿Está desplegada la carpeta api/ en Vercel?', 'sis'));

  async function enviar(texto) {
    burbuja(texto, 'yo'); visibles.push({ q: 'yo', t: texto }); recordar();
    const espera = burbuja('Escribiendo…', 'sis');
    try {
      const r = await api({ accion: 'mensaje', contacto, nombre: $('nombre').value.trim(), area: $('area').value, texto });
      espera.remove();
      const extra = (r.solicitudes || []).map((s) => `Solicitud #${s.id}: ${ETIQUETA[s.estado] || s.estado}`).join(' · ');
      burbuja(r.texto, 'bot', extra); visibles.push({ q: 'bot', t: r.texto, x: extra }); recordar();
    } catch (e) { espera.textContent = 'No se pudo enviar: ' + e.message; }
  }

  $('escribir').onsubmit = (ev) => { ev.preventDefault(); const t = $('texto').value.trim(); if (!t) return; $('texto').value = ''; enviar(t); };
  $('texto').addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); $('escribir').requestSubmit(); } });
  $('reiniciar').onclick = async () => {
    try { await api({ accion: 'reiniciar', contacto }); } catch {}
    visibles = []; recordar(); $('mensajes').innerHTML = ''; burbuja('Conversación nueva.', 'sis');
  };
  $('verMias').onclick = async () => {
    try {
      const { solicitudes } = await api({ accion: 'mis_solicitudes', contacto });
      burbuja(solicitudes.length ? solicitudes.map((s) => `#${s.id} · ${ETIQUETA[s.estado] || s.estado} · ${s.resumen}` + (s.respuesta_analista ? `\n  Analista: ${s.respuesta_analista}` : '')).join('\n') : 'Aún no tienes solicitudes.', 'sis');
    } catch (e) { burbuja('No se pudo leer: ' + e.message, 'sis'); }
  };

  // ---- Bandeja del analista ----
  function tarjeta(s) {
    const d = document.createElement('div'); d.className = 'tarjeta';
    const quien = [s.nombre, s.area].filter(Boolean).join(' · ') || s.contacto;
    const fecha = new Date(s.creado).toLocaleString('es-PE', { dateStyle: 'short', timeStyle: 'short' });
    const cambios = (s.cambios || []).map((c) => c.accion === 'cambiar_predecesor'
      ? `${c.lista}: «${c.paso}»${c.orden_paso ? ' (#' + c.orden_paso + ')' : ''} → ${c.sin_predecesor ? 'sin predecesor' : 'depende de «' + c.predecesor + '»' + (c.predecesor_orden ? ' (' + c.predecesor_orden + ')' : '')}`
      : `${c.lista}: «${c.paso}» → ${c.decimal} decimales`).join('\n');
    d.innerHTML = `<h3></h3><div class="tenue"></div><pre class="det"></pre><pre class="cam"></pre><pre class="res"></pre>
      <div class="fila"><input class="resp" placeholder="Responder a la persona" style="flex:1;min-width:200px"><button class="btn enviarResp">Responder</button>
      ${s.automatica && ['nueva', 'revisar'].includes(s.estado) ? '<button class="btn primario aprobar">Aprobar y aplicar</button>' : ''}
      ${['nueva', 'revisar'].includes(s.estado) ? '<button class="btn resolver">Marcar resuelta</button><button class="btn rechazar">Rechazar</button>' : ''}</div>`;
    d.querySelector('h3').textContent = `#${s.id} ${s.resumen || ''}`;
    const est = document.createElement('span'); est.className = 'estado ' + s.estado; est.textContent = s.estado; d.querySelector('h3').appendChild(est);
    d.querySelector('.tenue').textContent = `${fecha} · ${quien} · ${s.canal}${s.prioridad === 'alta' ? ' · PRIORIDAD ALTA' : ''}${s.rmd ? ' · RMD ' + s.rmd : ''}${s.op_lote ? ' · OP/lote ' + s.op_lote : ''}`;
    d.querySelector('.det').textContent = s.detalle || '';
    d.querySelector('.cam').textContent = cambios ? 'Cambios para aplicar solo:\n' + cambios : '';
    d.querySelector('.res').textContent = [s.resultado && 'Resultado: ' + s.resultado, s.respuesta_analista && 'Respuesta: ' + s.respuesta_analista].filter(Boolean).join('\n');
    const accion = async (cuerpo) => { try { await api({ accion: 'actualizar', id: s.id, analista: $('nombreAnalista').value.trim(), ...cuerpo }, true); cargar(); } catch (e) { alertar(e.message); } };
    d.querySelector('.enviarResp').onclick = () => { const t = d.querySelector('.resp').value.trim(); if (t) accion({ respuesta: t }); };
    d.querySelector('.aprobar')?.addEventListener('click', () => accion({ estado: 'lista' }));
    d.querySelector('.resolver')?.addEventListener('click', () => accion({ estado: 'resuelta', respuesta: d.querySelector('.resp').value.trim() }));
    d.querySelector('.rechazar')?.addEventListener('click', () => accion({ estado: 'rechazada', respuesta: d.querySelector('.resp').value.trim() || 'Rechazada por Documentación Técnica.' }));
    return d;
  }
  function alertar(t) { const p = document.createElement('p'); p.className = 'tenue'; p.textContent = t; $('listaBandeja').prepend(p); }
  async function cargar() {
    try {
      const { solicitudes, modo } = await api({ accion: 'bandeja' }, true);
      $('modoBandeja').textContent = modo === 'automatico' ? 'Modo automático: habilitar paso y decimales se aplican solos.' : 'Modo con aprobación: nada se aplica sin «Aprobar y aplicar».';
      const f = $('filtro').value ? $('filtro').value.split(',') : null;
      $('listaBandeja').innerHTML = '';
      const lista = solicitudes.filter((s) => !f || f.includes(s.estado));
      if (!lista.length) $('listaBandeja').innerHTML = '<p class="tenue">Sin solicitudes.</p>';
      lista.forEach((s) => $('listaBandeja').appendChild(tarjeta(s)));
    } catch (e) { $('listaBandeja').innerHTML = ''; alertar(e.message); }
  }
  $('cargar').onclick = cargar; $('filtro').onchange = cargar;
})();
</script>
</body>
</html>
